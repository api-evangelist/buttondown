description: >-
  Buttondown maintains a dated, per-change API changelog with 63 entries running from 2020-12-09 to
  2026-08-08. Entries are narrative and specific: each names the affected endpoints, states whether
  the change is additive or backwards-incompatible, and links to the reference pages that changed.
  Recent window captured below; the live changelog is the source of truth.
scheme: date
