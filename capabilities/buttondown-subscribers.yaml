      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: buttondown-subscribers.updatesubscriber
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-subscriber
      description: Delete a subscriber
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: buttondown-subscribers.deletesubscriber
      outputParameters:
