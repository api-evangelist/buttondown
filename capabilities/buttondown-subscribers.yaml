    description: Buttondown API — Subscribers business capability. Self-contained, no shared references.
    resources:
    - name: subscribers
      path: /subscribers
      operations:
      - name: listsubscribers
        method: GET
        description: List all subscribers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsubscriber
        method: POST
        description: Create a subscriber
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: subscribers-id
      path: /subscribers/{id}
      operations:
      - name: getsubscriber
        method: GET
        description: Retrieve a subscriber
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatesubscriber
        method: PATCH
        description: Update a subscriber
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletesubscriber
