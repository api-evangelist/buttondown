naftiko: 1.0.0-alpha2
info:
  label: Buttondown API — Tags
  description: 'Buttondown API — Tags. 3 operations. Lead operation: List all tags. Self-contained Naftiko capability covering
    one Buttondown business surface.'
  tags:
  - Buttondown
  - Tags
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BUTTONDOWN_API_KEY: BUTTONDOWN_API_KEY
capability:
  consumes:
  - type: http
    namespace: buttondown-tags
    baseUri: https://api.buttondown.email/v1
    description: Buttondown API — Tags business capability. Self-contained, no shared references.
    resources:
    - name: tags
      path: /tags
      operations:
      - name: listtags
        method: GET
        description: List all tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtag
        method: POST
        description: Create a tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: tags-id
      path: /tags/{id}
      operations:
      - name: gettag
        method: GET
        description: Retrieve a tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.BUTTONDOWN_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: buttondown-tags-rest
    port: 8080
    description: REST adapter for Buttondown API — Tags. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/tags
      name: tags
      description: REST surface for tags.
      operations:
      - method: GET
        name: listtags
        description: List all tags
        call: buttondown-tags.listtags
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtag
        description: Create a tag
        call: buttondown-tags.createtag
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tags/{id}
      name: tags-id
      description: REST surface for tags-id.
      operations:
      - method: GET
        name: gettag
        description: Retrieve a tag
        call: buttondown-tags.gettag
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: buttondown-tags-mcp
    port: 9090
    transport: http
    description: MCP adapter for Buttondown API — Tags. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-all-tags
      description: List all tags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: buttondown-tags.listtags
      outputParameters:
      - type: object
        mapping: $.
    - name: create-tag
      description: Create a tag
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: buttondown-tags.createtag
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-tag
      description: Retrieve a tag
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: buttondown-tags.gettag
      outputParameters:
      - type: object
        mapping: $.
