naftiko: 1.0.0-alpha2
info:
  label: Buttondown API — Newsletters
  description: 'Buttondown API — Newsletters. 1 operations. Lead operation: List all newsletters. Self-contained Naftiko capability
    covering one Buttondown business surface.'
  tags:
  - Buttondown
  - Newsletters
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BUTTONDOWN_API_KEY: BUTTONDOWN_API_KEY
capability:
  consumes:
  - type: http
    namespace: buttondown-newsletters
    baseUri: https://api.buttondown.email/v1
    description: Buttondown API — Newsletters business capability. Self-contained, no shared references.
    resources:
    - name: newsletters
      path: /newsletters
      operations:
      - name: listnewsletters
        method: GET
        description: List all newsletters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.BUTTONDOWN_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: buttondown-newsletters-rest
    port: 8080
    description: REST adapter for Buttondown API — Newsletters. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/newsletters
      name: newsletters
      description: REST surface for newsletters.
      operations:
      - method: GET
        name: listnewsletters
        description: List all newsletters
        call: buttondown-newsletters.listnewsletters
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: buttondown-newsletters-mcp
    port: 9090
    transport: http
    description: MCP adapter for Buttondown API — Newsletters. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-all-newsletters
      description: List all newsletters
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: buttondown-newsletters.listnewsletters
      outputParameters:
      - type: object
        mapping: $.
