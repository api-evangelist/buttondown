description: >-
  How the Buttondown API changes over time, and what a consumer is told about it. Buttondown runs a
  date-based API version train with an explicit backwards-incompatibility definition, a per-newsletter
  version pin, and a dated public API changelog. It publishes no formal SLA and no Sunset/Deprecation
  header contract.
versioning:
  scheme: date
  current: '2026-04-01'
  request_header: X-API-Version
  pinning:
    supported: true
    scope: newsletter
    location: https://buttondown.com/settings
    description: >-
      Each newsletter carries a pinned API version used when a request omits X-API-Version. With no
      pin, requests resolve to the latest version.
  breaking_change_definition:
    - Renaming or removing fields from an object
    - Removing or renaming an endpoint
    - Changing the type of a field
    - Changing whether a field is required
    - Changing logic within an endpoint
  docs: https://docs.buttondown.com/api-versioning
deprecation:
  policy_url: https://docs.buttondown.com/api-versioning
  sunset_header: false
  deprecation_header: false
  note: >-
    Buttondown does not publish RFC 8594 Sunset or Deprecation headers. Its deprecation contract is
    the version train itself: a breaking change ships as a new dated version and consumers stay on
    their pinned version. Exceptions are announced in the API changelog — the 2026-06-23 unified
    event-store migration is an example of a deliberately breaking change shipped WITHOUT a new API
    version, with the reasoning stated in the entry.
  deprecated_operations: []
