      description: An enumeration.
    StripeCoupon:
      description: 'Coupons let you offer discounts to subscribers who pay for your newsletter.

        Buttondown''s coupons are backed by Stripe, so each coupon maps to a coupon

        on your connected Stripe account. Use them to run promotions—for example, a

        percentage off a paid subscription.'
      properties:
        coupon_id:
          description: The Stripe coupon ID (e.g. `coupon_...`).
          title: Coupon Id
          type: string
        percent_off:
          anyOf:
          - type: string
          - type: 'null'
          description: The percentage discount applied by the coupon, if any.
          title: Percent Off
        amount_off:
          anyOf:
          - type: integer
          - type: 'null'
          description: The fixed amount discount applied by the coupon, in the smallest currency unit (e.g. cents), if any.
          title: Amount Off
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: The display name of the coupon.
          title: Name
      required:
      - coupon_id
      title: StripeCoupon
      type: object
    Subscriber:
      description: 'Subscribers are the main way you collect email addresses and

        recipients on Buttondown. They''re what you see on your

        [subscribers page](https://buttondown.com/subscribers).


        Relevant changes to the schema:


        - [2024-08-01](https://docs.buttondown.com/api-changelog-2024-08-01): renamed `subscriber_type` and `email` to `type`
        and `email_address` respectively.

        - [2024-07-13](https://docs.buttondown.com/api-changelog-2024-08-01): removed `external_url` in favor of `absolute_url`.'
      properties:
        id:
          description: A unique TypeID associated with the object.
          title: Id
          type: string
        creation_date:
          description: The date and time at which the object was first created.
          format: date-time
          title: Creation Date
          type: string
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          description: URL of the subscriber's avatar image (e.g. a Gravatar URL), if available.
          title: Avatar Url
        bounce_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: The date of the subscriber's most recent bounce event. May be set even if the subscriber has not yet
            been marked as undeliverable.
          title: Bounce Date
        bounce_reason:
          anyOf:
          - $ref: '#/components/schemas/SubscriberUndeliverabilityReason'
          - type: 'null'
          description: The reason of the subscriber's most recent bounce event. May be set even if the subscriber has not
            yet been marked as undeliverable.
        churn_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the subscriber cancelled their paid subscription, if applicable.
          title: Churn Date
        commenting_disabled:
          default: false
          description: Whether this subscriber is prevented from commenting.
          title: Commenting Disabled
          type: boolean
        country:
          anyOf:
          - type: string
          - type: 'null'
          description: The ISO 3166-1 alpha-2 country code inferred from the subscriber's IP address at signup, if available.
          example: US
          title: Country
        email_address:
          description: The email address of the subscriber.
          example: telemachus@buttondown.email
          title: Email Address
          type: string
        gift_subscription_end_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the subscriber's gift subscription expires, if applicable.
          title: Gift Subscription End Date
        gift_subscription_message:
          anyOf:
          - type: string
          - type: 'null'
          description: A custom message that was sent to the subscriber when the gift subscription was created.
          title: Gift Subscription Message
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          description: The IP address recorded when the subscriber signed up, if available.
          title: Ip Address
        last_click_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the subscriber most recently clicked a link in an email.
          title: Last Click Date
        last_open_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the subscriber most recently opened an email.
          title: Last Open Date
        delivered_count:
          anyOf:
          - type: integer
          - type: 'null'
          description: The number of distinct emails — both broadcasts and automation sends — delivered to this subscriber.
            Cached and refreshed periodically, so it may lag recent activity.
          example: 12
          title: Delivered Count
        open_count:
          anyOf:
          - type: integer
          - type: 'null'
          description: The subscriber's open count.
          example: 7
          title: Open Count
        clicked_count:
          anyOf:
          - type: integer
          - type: 'null'
          description: The subscriber's clicked count.
          example: 3
          title: Clicked Count
        open_rate:
          anyOf:
          - type: number
          - type: 'null'
          description: The subscriber's open rate, computed from engagement counts. Null if delivered_count is 0 or null.
          example: 0.5833
          title: Open Rate
        click_rate:
          anyOf:
          - type: number
          - type: 'null'
          description: The subscriber's click rate, computed from engagement counts. Null if delivered_count is 0 or null.
          example: 0.25
          title: Click Rate
        metadata:
          additionalProperties: true
          default: {}
          description: A structured key-value blob that you can use to store arbitrary data on the object. Metadata can be
            nested — you can store objects and arrays within your metadata. (You can [read more about metadata.](https://docs.buttondown.com/metadata))
          title: Metadata
          type: object
        notes:
          default: ''
          description: Any notes you want to attach to the subscriber. These are not publicly visible.
          title: Notes
          type: string
        purchased_by:
          anyOf:
          - type: string
          - type: 'null'
          description: The email address of the individual who purchased this subscription on behalf of the subscriber.
          title: Purchased By
        purchased_message:
          anyOf:
          - type: string
          - type: 'null'
          description: A custom message that was sent to the subscriber when the subscription was purchased on behalf of the
            subscriber.
          title: Purchased Message
        referral_code:
          description: The subscriber's unique referral code, used to attribute referred signups.
          title: Referral Code
          type: string
        referrer_url:
          default: ''
          description: The URL the subscriber was referred from (e.g. where they submitted the subscription form).
          title: Referrer Url
          type: string
        risk_score:
          anyOf:
          - type: number
          - type: 'null'
          description: The risk score of the subscriber. Positive numbers represent a higher risk; negative numbers represent
            a lower risk.
          title: Risk Score
        secondary_id:
          description: A human-readable sequential identifier, unique within the newsletter.
          title: Secondary Id
          type: integer
        source:
          $ref: '#/components/schemas/SubscriberSource'
          description: Where the subscriber signed up from (e.g. `api`, `import`, `form`).
        stripe_coupon:
          anyOf:
          - $ref: '#/components/schemas/StripeCoupon'
          - type: 'null'
          description: The Stripe coupon applied to the subscriber's paid subscription, if any.
        stripe_customer_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The Stripe customer ID associated with the subscriber, if any.
          title: Stripe Customer Id
        subscriber_import_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the [subscriber import](https://docs.buttondown.com/importing-subscribers) that created this
            subscriber, if any.
          title: Subscriber Import Id
        tags:
          description: A list of [tag](https://docs.buttondown.com/api-tags-introduction) names applied to the subscriber.
            Tags that don't already exist will be created, which requires a plan that includes tags (Basic or higher).
          items:
            type: string
          title: Tags
          type: array
        transitions:
          default: []
          description: The history of subscriber type transitions (e.g. `regular` → `premium`).
          items:
            $ref: '#/components/schemas/Transition'
          title: Transitions
          type: array
        email_transitions:
          default: []
          description: The history of email address changes for this subscriber.
          items:
            $ref: '#/components/schemas/EmailTransition'
          title: Email Transitions
          type: array
        form_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the [registration form](https://docs.buttondown.com/registration-forms) the subscriber signed
            up through, if any.
          title: Form Id
        firewall_reasons:
          description: Information collected by Buttondown's firewall about this subscriber. See [the firewall](https://docs.buttondown.com/firewall)
            for more information.
          items:
            $ref: '#/components/schemas/FirewallReason'
          title: Firewall Reasons
          type: array
        type:
          $ref: '#/components/schemas/SubscriberType'
          description: 'The subscriber''s lifecycle state. One of: `blocked` (blocked by the newsletter), `churned` (previously
            paid, subscription ended), `churning` (paying but won''t renew), `complained` (marked an email as spam), `gifted`
            (granted free premium access by the newsletter), `past_due` (paid subscription with an overdue invoice), `paused`
            (premium subscription paused), `premium` (paying subscriber), `regular` (active free subscriber), `removed` (removed
            by the newsletter), `trialed` (temporarily enrolled in premium), `unactivated` (pending double opt-in confirmation),
            `undeliverable` (determined undeliverable), `unpaid` (has not paid yet), `unsubscribed` (voluntarily unsubscribed),
            `upcoming` (paid subscription that has not started yet). Subscribers with `premium`, `gifted`, `trialed`, or `churning`
            have access to premium content; use these to distinguish paid from free subscribers.'
        undeliverability_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the subscriber was marked as undeliverable, if applicable.
          title: Undeliverability Date
        undeliverability_reason:
          anyOf:
          - $ref: '#/components/schemas/SubscriberUndeliverabilityReason'
          - type: 'null'
          description: The reason the subscriber is undeliverable. (Only populated for undeliverable subscribers.)
        unsubscription_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the subscriber unsubscribed, if applicable.
          title: Unsubscription Date
        unsubscription_reason:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text reason the subscriber unsubscribed, if provided.
          title: Unsubscription Reason
        upgrade_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the subscriber upgraded to a paid subscription, if applicable.
          title: Upgrade Date
        utm_campaign:
          description: The UTM campaign the subscriber was attributed to at signup.
          title: Utm Campaign
          type: string
        utm_medium:
          description: The UTM medium the subscriber was attributed to at signup.
          title: Utm Medium
          type: string
        utm_source:
          description: The UTM source the subscriber was attributed to at signup.
          title: Utm Source
          type: string
        stripe_customer:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: If expanded, the Stripe customer associated with this subscriber.
          title: Stripe Customer
        stripe_subscription:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: If expanded, the Stripe subscription backing this subscriber's paid subscription.
          title: Stripe Subscription
      required:
      - id
      - creation_date
      - email_address
      - referral_code
      - secondary_id
      - source
      - tags
      - type
      - utm_campaign
      - utm_medium
      - utm_source
      title: Subscriber
      type: object
    SubscriberSource:
      description: 'Represents the original provenance of a subscriber. This value is not exposed

        to subscribers; it''s only used for internal tracking purposes and governs some

        of the behavior of the subscriber (i.e. whether or not to require double

        opt-in.)'
      enum:
      - admin
      - api
      - carrd
      - comment
      - embedded_form
      - form
      - import
      - memberful
      - netlify
      - organic
      - patreon
      - shopify
      - stripe
      - user
      - zapier
      title: Source
      type: string
    SubscriberType:
      description: 'Represents the state of a subscriber and what emails they

        should or should not be receiving. This type is meant to be fully expressive

        so as to consolidate the logic of determining what emails a subscriber should

        receive into a single place.


        Note that the only types that can be set programmatically are REGULAR, UNSUBSCRIBED,

        GIFTED and UNPAID. All other types are meant to be user-visible and cannot

        be set programmatically.'
      enum:
      - blocked
      - complained
      - churning
      - churned
      - gifted
      - unactivated
      - unpaid
      - undeliverable
      - premium
      - past_due
      - paused
      - regular
      - removed
      - trialed
      - unsubscribed
      - upcoming
      title: Type
      type: string
    SubscriberUndeliverabilityReason:
      description: "The reason Buttondown has marked the subscriber as undeliverable.\nUndeliverable subscribers are not sent\
        \ emails, and may be periodically removed from the system (or restored, if the reason is no longer valid.)\n\nThese\
        \ reasons are grouped into three categories:\n- PermanentFailure (\"Failed (recipient)\"): Address-based issues where\
        \ the recipient is truly unreachable.\n  Includes: HARD_BOUNCE\n- MessageFailure (\"Failed (message)\"): Message/sender\
        \ problems where future emails may succeed.\n  Includes: ACCESS_DENIED, AUTHENTICATION_ISSUE, DELIVERY_EXPIRED, DOMAIN_BLOCKED,\
        \ EMAIL_BLOCKED,\n            IP_BLOCKED, ON_ESP_DENYLIST, OUT_OF_STORAGE, PROBLEMATIC_URL, SPAM\n- Deferral (not\
        \ shown to customers): Transient delivery issues that will be retried.\n  Includes: RATE_LIMITED, TRANSIENT"
      enum:
      - access_denied
      - authentication_issue
      - delivery_expired
      - domain_blocked
      - email_blocked
      - hard_bounce
      - ip_blocked
      - ip_undeliverable
      - malformed
      - on_esp_denylist
      - other
      - out_of_storage
      - problematic_url
      - rate_limited
      - spam
      - transient
      - disabled
      - does_not_exist
      - spf_failed
      - unreachable
      title: UndeliverabilityReason
      type: string
    Transition:
      properties:
        date:
          description: When the subscriber transitioned to `type`.
          format: date-time
          title: Date
          type: string
        type:
          $ref: '#/components/schemas/SubscriberType'
          description: The subscriber type the subscriber transitioned to at `date`.
      required:
      - date
      - type
      title: Transition
      type: object
    ValidationErrorDetail:
      properties:
        type:
          description: The type of validation error.
          title: Type
          type: string
        loc:
          description: The location of the error in the request.
          items:
            anyOf:
            - type: string
            - type: integer
          title: Loc
          type: array
        msg:
          description: A human-readable error message.
          title: Msg
          type: string
      required:
      - type
      - loc
      - msg
      title: ValidationErrorDetail
      type: object
    ValidationErrorMessage:
      properties:
        detail:
          description: A list of validation errors.
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
          title: Detail
          type: array
      required:
      - detail
      title: ValidationErrorMessage
      type: object
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key passed as 'Token <your-api-key>' in the Authorization header.
