            cadences; `weekday` is required for `weekly`; `monthday` is required for `monthly`. See the [cadence metadata
            reference](https://docs.buttondown.com/api-external-feed-cadence-metadata) for allowed values.
        filters:
          $ref: '#/components/schemas/FilterGroup'
          description: Tag-based filtering rules used to decide which subscribers receive feed-generated emails.
        subject:
          description: The subject line template for emails generated from this feed.
          maxLength: 255
          minLength: 1
          title: Subject
          type: string
        body:
          description: The body template for emails generated from this feed.
          minLength: 1
          title: Body
          type: string
        label:
          default: ''
          description: An optional internal label for this feed.
          maxLength: 255
