      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: string
        required: true
      - in: path
        name: history_id
        schema:
          title: History Id
          type: integer
        required: true
      - in: query
        name: expand
        schema:
          description: If provided, expand the given field.
          items:
