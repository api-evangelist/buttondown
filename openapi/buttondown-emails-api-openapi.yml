  /emails/{id}/history:
    get:
      operationId: retrieve_email_history
      summary: Retrieve Email History
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: string
        required: true
      - in: query
        name: expand
        schema:
          description: If provided, expand the given field.
          items:
            const: user
            type: string
          title: Expand
          type: array
        required: false
        description: If provided, expand the given field.
      - in: query
        name: field
        schema:
          description: The field to retrieve history for.
          minLength: 1
          title: Field
          type: string
        required: true
        description: The field to retrieve history for.
      - in: query
        name: page
        schema:
          description: The page number of the paginated response.
          example: 1
          title: Page
          type: integer
        required: false
        description: The page number of the paginated response.
        example: 1
      - in: query
        name: ordering
        schema:
          default: creation_date
          description: The ordering to apply to the results.
          enum:
          - creation_date
          - -creation_date
          title: Ordering
          type: string
        required: false
        description: The ordering to apply to the results.
      - in: query
        name: query
        schema:
          description: If provided, only return history entries matching the given query.
          title: Query
          type: string
        required: false
        description: If provided, only return history entries matching the given query.
      - in: query
        name: page_size
        schema:
          default: 100
          description: The number of results per page.
          title: Page Size
          type: integer
        required: false
        description: The number of results per page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: Conflict
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: Requests permitted per minute.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp at which the window resets.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      description: Retrieve the edit history for a specific email
      tags:
      - Emails
      security:
      - ApiKeyAuth: []
  /emails/{id}/history/body/{history_id}:
    get:
      operationId: retrieve_email_history_by_id
