aid: buttondown
name: Buttondown
description: Buttondown is an independent, bootstrapped email newsletter platform for writers, creators and developers,
  offering a Markdown and rich-text editor, subscriber management with tags, segments and metadata, automations,
  RSS-to-email, surveys, comments, paid subscriptions via Stripe with no revenue share, custom sending and hosting
  domains, and hosted archives. Its public REST API covers 133 operations across 29 resource areas — subscribers,
  emails, tags, segments, automations, webhooks, imports, exports, surveys, forms, images, snippets, prices and
  more — described by a live OpenAPI 3.1 document, backed by an 82-event webhook catalog, a date-based version train,
  idempotency keys, and a first-party CLI for syncing newsletter content to a local folder.
type: Index
kind: company
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
